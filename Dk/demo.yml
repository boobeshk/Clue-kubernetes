apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clue-autofix-demo
  template:
    metadata:
      labels:
        app: clue-autofix-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command:
            - sh
            - '-c'
            - echo starting; sleep 3; exit 1
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Service
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
    app.kubernetes.io/name: clue-autofix-demo
    app.kubernetes.io/instance: clue-autofix-demo
    app.kubernetes.io/managed-by: clue
spec:
  selector:
    app: clue-autofix-demo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clue-autofix-demo-pdb
  namespace: clue-test
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clue-autofix-demo
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clue-autofix-demo-hpa
  namespace: clue-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clue-autofix-demo
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
