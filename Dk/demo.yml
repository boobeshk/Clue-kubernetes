apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clue-autofix-demo
  template:
    metadata:
      labels:
        app: clue-autofix-demo
    spec:
      containers:
        - name: demo
          image: nginx:1.27.0
          ports:
            - containerPort: 80
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clue-autofix-demo
  namespace: clue-test
spec:
  selector:
    app: clue-autofix-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
