# AutoFix test manifest — intentionally violates several catalog rules.
# Expected detections: SEC-001 (privileged), SEC-003 (allowPrivilegeEscalation),
# SEC-002 (runAsNonRoot missing), SEC-011 (readOnlyRootFilesystem missing),
# SEC-012 (seccompProfile missing), SEC-013 (capabilities.drop missing),
# SEC-015 (image :latest), RES-001..004 (requests/limits missing),
# LBL-002..004 (recommended labels missing). Service is intentionally CLEAN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clue-autofix-demo
  template:
    metadata:
      labels:
        app: clue-autofix-demo
    spec:
      containers:
        - name: demo
          image: nginx:latest          # SEC-015: pinned tag missing
          ports:
            - containerPort: 80
          # RES-001..004: no resources block at all
          securityContext:
            privileged: true            # SEC-001
            allowPrivilegeEscalation: true   # SEC-003
            # SEC-002 runAsNonRoot, SEC-011 readOnlyRootFilesystem,
            # SEC-012 seccompProfile, SEC-013 capabilities.drop all missing
---
apiVersion: v1
kind: Service
metadata:
  name: clue-autofix-demo
  namespace: clue-test
spec:
  selector:
    app: clue-autofix-demo          # matches pod labels -> no NoEndpoints issue
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
