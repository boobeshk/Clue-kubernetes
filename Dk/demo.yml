apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clue-autofix-demo
  template:
    metadata:
      labels:
        app: clue-autofix-demo
    spec:
      containers:
        - name: demo
          image: nginx:latest
          ports:
            - containerPort: 80
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
    app.kubernetes.io/name: clue-autofix-demo
    app.kubernetes.io/instance: clue-autofix-demo
    app.kubernetes.io/managed-by: clue
spec:
  selector:
    app: clue-autofix-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
