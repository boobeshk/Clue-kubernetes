apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
    app.kubernetes.io/name: clue-autofix-demo
    app.kubernetes.io/instance: clue-autofix-demo
    app.kubernetes.io/managed-by: clue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clue-autofix-demo
  template:
    metadata:
      labels:
        app: clue-autofix-demo
        app.kubernetes.io/name: clue-autofix-demo
        app.kubernetes.io/instance: clue-autofix-demo
        app.kubernetes.io/managed-by: clue
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command:
            - sh
            - '-c'
            - echo starting; sleep 3; exit 1
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          imagePullPolicy: IfNotPresent
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clue-autofix-demo
  namespace: clue-test
  labels:
    app: clue-autofix-demo
    app.kubernetes.io/name: clue-autofix-demo
    app.kubernetes.io/instance: clue-autofix-demo
    app.kubernetes.io/managed-by: clue
spec:
  selector:
    app: clue-autofix-demo
  ports:
    - port: 80
      targetPort: 8080
