# clue-autofix-test.yaml
# ---------------------------------------------------------------------------
# One manifest that intentionally triggers EVERY AutoFix Ops detector so you
# can verify the scan end-to-end.
#
# 1. Set the namespace below to the namespace your Clue PROJECT points at
#    (or delete the two `namespace:` lines to use your current kubectl namespace).
# 2. kubectl apply -f clue-autofix-test.yaml
# 3. In Clue -> AutoFix Ops -> "Scan All"   (or: curl -X POST http://localhost:8001/api/autofix/scan-all)
# 4. View results:  curl -s http://localhost:8001/api/autofix/issues | jq '.issues[].issue_type'
#    (Pod-state issues need ~30-60s to appear while the container crash-loops.)
# 5. Clean up:  kubectl delete -f clue-autofix-test.yaml
#
# Each commented line maps to the issue_type the scanner should report.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-autofix-demo
  namespace: clue-test                 # <-- change to your Clue project's namespace
  labels:
    app: clue-autofix-demo
spec:
  replicas: 1                          # -> SingleReplica            (medium)
  selector:
    matchLabels:
      app: clue-autofix-demo
  template:
    metadata:
      labels:
        app: clue-autofix-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          # Crash-loops on purpose:
          #   -> PodWaiting / CrashLoopBackOff   (high)
          #   -> HighPodRestarts (after >=3)     (medium)
          command: ["sh", "-c", "echo starting; sleep 3; exit 1"]
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true            # -> PrivilegedContainer      (critical)
            allowPrivilegeEscalation: true
            # runAsNonRoot omitted       -> RunAsNonRootMissing       (medium)
          # readinessProbe omitted       -> MissingReadinessProbe     (high)
          # livenessProbe omitted        -> MissingLivenessProbe      (medium)
          # resources.requests omitted   -> MissingResourceRequests   (medium)
          # resources.limits omitted     -> MissingResourceLimits     (medium)
---
apiVersion: v1
kind: Service
metadata:
  name: clue-autofix-demo
  namespace: clue-test                 # <-- same namespace as above
spec:
  selector:
    app: clue-autofix-demo             # matches pods that never become Ready
  ports:                               #   -> NoEndpoints              (critical)
    - port: 80
      targetPort: 8080
