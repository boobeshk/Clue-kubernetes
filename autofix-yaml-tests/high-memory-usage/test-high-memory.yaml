apiVersion: v1
kind: Namespace
metadata:
  name: autofix-demo
  namespace: default
  labels:
    app: autofix-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-high-memory
  namespace: autofix-demo
  labels:
    app: test-high-memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-high-memory
  template:
    metadata:
      labels:
        app: test-high-memory
    spec:
      containers:
        - name: mem-stress
          image: polinux/stress
          command:
            - stress
          args:
            - '--vm'
            - '2'
            - '--vm-bytes'
            - 500M
            - '--timeout'
            - 300s
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
