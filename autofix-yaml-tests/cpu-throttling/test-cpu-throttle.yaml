apiVersion: v1
kind: Namespace
metadata:
  name: autofix-demo
  labels:
    app: autofix-demo


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-cpu-throttle
  namespace: autofix-demo
  labels:
    app: test-cpu-throttle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-cpu-throttle
  template:
    metadata:
      labels:
        app: test-cpu-throttle
    spec:
      containers:
        - name: stress
          image: containerstack/cpustress:latest
          env:
            - name: CPU_CORE
              value: '2'
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
