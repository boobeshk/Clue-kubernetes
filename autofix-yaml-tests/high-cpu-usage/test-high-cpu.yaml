apiVersion: v1
kind: Namespace
metadata:
  name: autofix-demo
  namespace: default
  labels:
    app: autofix-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-high-cpu
  namespace: autofix-demo
  labels:
    app: test-high-cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-high-cpu
  template:
    metadata:
      labels:
        app: test-high-cpu
    spec:
      containers:
        - name: cpu-stress
          image: progrium/stress
          args:
            - '--cpu'
            - '2'
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
