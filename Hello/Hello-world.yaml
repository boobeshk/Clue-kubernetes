apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
  namespace: devtest
  labels:
    app: hello-world
    app.kubernetes.io/name: hello-world
    owner: platform
    team: platform
    environment: dev
spec:
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: hashicorp/http-echo:latest
          args:
            - '-text=Hello, World!'
            - '-listen=:5000'
          ports:
            - containerPort: 5000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          imagePullPolicy: Always
          startupProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  replicas: 2
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
  namespace: devtest
  labels:
    app: hello-world
    app.kubernetes.io/name: hello-world
    owner: platform
    team: platform
    environment: dev
spec:
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
