apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
  namespace: clue-test
spec:
  selector:
    matchLabels:
      app: hello-world
  replicas: 1
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: hashicorp/http-echo
          args:
            - "-text=Hello, World!"
            - "-listen=:5000"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
  namespace: clue-test
spec:
  selector:
    app: hello-world
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: NodePort