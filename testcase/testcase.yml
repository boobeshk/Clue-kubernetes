apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: clue-test
  name: doc-1
  labels:
    app: ai-fix-demo
    app.kubernetes.io/name: doc-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-fix-demo
  template:
    metadata:
      labels:
        app: ai-fix-demo
        app.kubernetes.io/name: doc-1
        app.kubernetes.io/managed-by: clue
    spec:
      containers:
        - name: demo
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: ai-fix-demo
  namespace: clue-test
  labels:
    app: ai-fix-demo
spec:
  selector:
    app: ai-fix-demo
    app.kubernetes.io/name: doc-1
    app.kubernetes.io/managed-by: clue
  ports:
    - port: 80
      targetPort: 80