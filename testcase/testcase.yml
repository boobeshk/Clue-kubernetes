kind: Deployment
metadata:
  namespace: clue-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-fix-demo
  template:
    metadata:
      labels:
        app: ai-fix-demo
    spec:
      containers:
        - name: demo
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ai-fix-demo
  namespace: clue-test
spec:
  selector:
    app: ai-fix-demo
  ports:
    - port: 80
      targetPort: 80
